  /* ---------- 복습 ---------- */
  // 지금까지 카드로 배운 단어를 다시 본다. 아는 단어로 뺀 단어는 나오지 않는다. 복습 날짜(3일·7일)는 바꾸지 않는다.
  // 수준 테스트나 단계 올리기로 건너뛴 단계가 있으면, 그 단계의 단어는 아직 안 배웠어도 복습에서 열어 둔다.
  var RV = { scope: "all", size: 20 };
  var RV_SIZES = [10, 20, 30, 0];
  function learnedIds() {
    return Object.keys(S.words).map(Number).filter(function (id) { return id >= 0 && id < W.length && S.words[id].s !== "k" && seenCard(id); })
      .sort(function (a, b) { return a - b; });
  }
  // 건너뛴 단계: 더 높은 단계 단어를 이미 배웠는데, 아직 한 번도 나오지 않은 단어가 남아 있는 낮은 단계
  function skippedLevels() {
    var top = 0, missing = {};
    W.forEach(function (w, id) {
      var st = S.words[id];
      if (st && st.s !== "k") top = Math.max(top, w[6]);
      else if (!st) missing[w[6]] = 1;
    });
    var out = [];
    for (var L = 1; L < top; L++) if (missing[L]) out.push(L);
    return out;
  }
  function reviewScopes() {
    var all = learnedIds(), since = P.addDays(today, -6);
    var sc = {
      all: all,
      weak: all.filter(function (id) { return S.words[id].s === "l"; }),
      keep: flagIds().filter(function (id) { return !(S.words[id] && S.words[id].s === "k"); }),
      recent: all.filter(function (id) { var w = S.words[id]; return !!(w.in && w.in >= since); }),
      skipped: skippedLevels()
    };
    sc.skipped.forEach(function (L) {
      sc["L" + L] = W.map(function (w, id) { return id; }).filter(function (id) { return W[id][6] === L && !(S.words[id] && S.words[id].s === "k"); });
    });
    return sc;
  }
  function reviewPick() {
    var ids = shuffle((reviewScopes()[RV.scope] || []).slice());
    return RV.size ? ids.slice(0, RV.size) : ids;
  }
  function reviewHTML() {
    var sc = reviewScopes();
    if (!sc[RV.scope] || RV.scope === "skipped") RV.scope = "all";
    var ids = sc[RV.scope];
    var head = '<header class="hdr"><span class="hdr-date">카드로 배운 단어 ' + num(sc.all.length) + "개</span><h1>복습</h1></header>";
    if (!sc.all.length && !sc.skipped.length && !sc.keep.length) {
      return head + '<section class="card-s"><h2 class="card-h">아직 배운 단어가 없어요</h2><p class="meta">오늘 단어를 카드로 보면 여기에서 다시 볼 수 있어요.</p>' +
        '<div class="btn-row" style="grid-template-columns:1fr"><button class="btn primary" data-act="go" data-v="cards" type="button">오늘 단어 카드로 보기</button></div></section>';
    }
    var scopes = [["all", "전체", sc.all.length], ["weak", "못 외움", sc.weak.length], ["recent", "최근 7일", sc.recent.length], ["keep", "계속 보기", sc.keep.length]];
    var seg = '<section class="card-s"><div class="seg seg-n" role="group" aria-label="복습할 단어">' + scopes.map(function (x) {
      return '<button data-act="rvscope" data-v="' + x[0] + '" aria-pressed="' + (RV.scope === x[0]) + '"><span>' + x[1] + "</span><small>" + x[2] + "</small></button>";
    }).join("") + "</div></section>";
    var skipped = !sc.skipped.length ? "" : '<h2 class="sec-label">건너뛴 단계</h2><section class="card-s"><div class="rv-lv" role="group" aria-label="건너뛴 단계">' +
      sc.skipped.map(function (L) {
        var k = "L" + L;
        return '<button data-act="rvscope" data-v="' + k + '" aria-pressed="' + (RV.scope === k) + '" type="button"><span>' + lvName(L) + "</span><small>" + num(sc[k].length) + "개</small></button>";
      }).join("") + "</div></section>";
    var size = '<section class="card-s"><div class="seg" role="group" aria-label="한 번에 볼 단어 수">' + RV_SIZES.map(function (n) {
      return '<button data-act="rvsize" data-v="' + n + '" aria-pressed="' + (RV.size === n) + '">' + (n ? n : "전체") + "</button>";
    }).join("") + "</div></section>";
    var n = RV.size ? Math.min(RV.size, ids.length) : ids.length;
    var chips = ids.slice(0, 8).map(function (id) { return '<span class="chip" lang="en">' + esc(W[id][0]) + "</span>"; }).join("") +
      (ids.length > 8 ? '<span class="chip more">+' + (ids.length - 8) + "</span>" : "");
    return head + '<h2 class="sec-label">복습할 단어</h2>' + seg + skipped + '<h2 class="sec-label">한 번에</h2>' + size +
      (ids.length
        ? '<section class="card-s"><div class="chips">' + chips + "</div>" +
            '<div class="btn-col"><button class="btn primary" data-act="rvcards" type="button">카드로 복습 · ' + n + "장</button>" +
            '<button class="btn" data-act="rvquiz" type="button">퀴즈로 복습 · ' + n + "문제</button></div></section>"
        : '<section class="card-s"><p class="p">여기에 해당하는 단어가 없어요.</p></section>');
  }

  /* ---------- 단어장 ---------- */
  // 모든 단어를 단계 순으로 보여 주고, 영어나 뜻(단어 구성의 뜻 포함)으로 찾는다.
  var WB = { q: "", f: "all", limit: 50, open: -1 }, wbTimer = null, BOOK_ORDER = null;
  var WB_FILTERS = [["all", "전체"], ["studied", "공부한 단어"], ["keep", "계속 보기"], ["memo", "메모"],
    ["L1", "1단계"], ["L2", "2단계"], ["L3", "3단계"], ["L4", "4단계"], ["L5", "5단계"], ["L6", "6단계"], ["L7", "7단계"]];
  function bookOrder() {
    if (!BOOK_ORDER) BOOK_ORDER = W.map(function (w, i) { return i; }).sort(function (a, b) { return (W[a][6] - W[b][6]) || (W[a][3] - W[b][3]) || a - b; });
    return BOOK_ORDER;
  }
  function wordStatus(id) {
    var w = S.words[id];
    if (!w) return ["", "아직 안 배움"];
    return { l: ["learning", "외우는 중"], r: ["done", "외움"], m: ["done", "완전히 외움"], k: ["known", "아는 단어"] }[w.s] || ["", ""];
  }
  function bookMatches() {
    var raw = WB.q.trim(), q = raw.toLowerCase(), f = WB.f, out = [];
    var qk = q.replace(/[^a-z0-9가-힣]/g, "");
    bookOrder().forEach(function (id) {
      var w = W[id];
      if (f === "studied" && !S.words[id]) return;
      if (f === "keep" && !isFlagged(id)) return;
      if (f === "memo" && !noteOf(id)) return;
      if (f.charAt(0) === "L" && w[6] !== +f.slice(1)) return;
      if (!q) { out.push([0, id]); return; }
      var en = w[0].toLowerCase(), enk = en.replace(/[^a-z0-9]/g, ""), r = -1, at = en.indexOf(q);
      if (en === q || (qk && enk === qk)) r = 0;
      else if (at === 0 || (qk && enk.indexOf(qk) === 0)) r = 1;
      else if (at > 0) r = 2;
      else if (w[1].indexOf(raw) >= 0) r = 3;
      else if (w[2].toLowerCase().indexOf(q) >= 0) r = 4;
      if (r >= 0) out.push([r, id]);
    });
    if (q) out.sort(function (a, b) { return a[0] - b[0]; });
    return out.map(function (x) { return x[1]; });
  }
  function bookRow(id) {
    var w = W[id], st = wordStatus(id), open = WB.open === id, f = isFlagged(id), note = noteOf(id);
    var head = '<button class="wb-row" data-act="wbopen" data-v="' + id + '" aria-expanded="' + open + '" type="button">' +
      '<span class="wb-main"><span class="w" lang="en">' + esc(w[0]) + '</span><span class="pos">' + esc(catShort(id)) + "</span>" +
      (f ? '<span class="wb-tag keep">계속 보기</span>' : "") + (note ? '<span class="wb-tag note">메모</span>' : "") + "</span>" +
      '<span class="m">' + esc(w[1]) + '</span><span class="wb-st ' + st[0] + '">' + st[1] + "</span></button>";
    if (!open) return '<div class="wb-item">' + head + "</div>";
    return '<div class="wb-item open">' + head + '<div class="wb-detail">' +
      partsHTML(id, true) + exampleHTML(id) +
      '<p class="meta" style="margin:0">' + lvName(w[6]) + " · " + esc(catName(id)) + "</p>" +
      memoView(id) +
      '<div class="w-acts" style="justify-content:flex-start">' +
        (canSpeak ? '<button class="w-act" data-act="speak" data-v="' + id + '" type="button">발음 듣기</button>' : "") +
        '<button class="w-act" data-act="flag" data-v="' + id + '" aria-pressed="' + f + '" type="button">' + (f ? "계속 보는 중" : "계속 보기") + "</button>" +
        '<button class="w-act" data-act="memo" data-v="' + id + '" aria-pressed="' + (memoFor === id) + '" type="button">' + (note ? "메모 수정" : "메모 추가") + "</button>" +
      "</div>" + memoEditor(id) + "</div></div>";
  }
  function bookListHTML() {
    var ids = bookMatches(), shown = ids.slice(0, WB.limit), q = WB.q.trim();
    return '<p class="meta wb-count">' + (q ? "검색 결과 " : "") + num(ids.length) + "개</p>" +
      (shown.length ? '<div class="rows">' + shown.map(bookRow).join("") + "</div>"
                    : '<section class="card-s"><p class="p">' + (q ? "‘" + esc(q) + "’에 맞는 단어가 없어요." : "여기에 해당하는 단어가 없어요.") + "</p></section>") +
      (ids.length > shown.length ? '<button class="btn wb-more" data-act="wbmore" type="button">' + Math.min(50, ids.length - shown.length) + "개 더 보기</button>" : "");
  }
  function bookHTML() {
    return '<header class="hdr"><span class="hdr-date">' + num(W.length) + "개 · 1~7단계</span><h1>단어장</h1></header>" +
      '<div class="wb-search"><svg class="wb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>' +
        '<input id="wb-q" type="search" placeholder="영어나 뜻으로 찾기" value="' + esc(WB.q) + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search"></div>' +
      '<div class="wb-chips" role="group" aria-label="단어 고르기">' + WB_FILTERS.map(function (c) {
        return '<button class="wb-chip" data-act="wbf" data-v="' + c[0] + '" aria-pressed="' + (WB.f === c[0]) + '" type="button">' + c[1] + "</button>";
      }).join("") + "</div>" +
      '<div id="wb-list" class="wb-list">' + bookListHTML() + "</div>";
  }

  /* ---------- 스펠링 ---------- */
  // 이미 본 단어만 낸다: 아는 단어, 외운 단어(복습 중 포함), 지난날 배운 단어, 오늘 카드·퀴즈·체크로 본 단어.
  // 숨긴 단어는 나오지 않고, 틀린 단어는 4문제 뒤에 다시 나온다.
  var SPL = { id: -1, state: "ask", typed: "", recent: [], retry: [], n: 0, ok: 0, showHidden: false, focus: false };
  function spellHide() { return (S.spell && S.spell.hide) || {}; }
  function hiddenIds() {
    var h = spellHide();
    return Object.keys(h).filter(function (k) { return h[k]; }).map(Number).sort(function (a, b) { return a - b; });
  }
  function spellPool() {
    var hide = spellHide(), d = day(), sawToday = !!(d && (d.cards || d.quiz)), out = [];
    Object.keys(S.words).forEach(function (k) {
      var w = S.words[k], id = +k;
      if (hide[id] || !(id >= 0 && id < W.length)) return;
      if (w.s === "k" || w.s === "r" || w.s === "m") out.push(id);
      else if (w.s === "l" && ((w.in && w.in < today) || sawToday || (d && d.checks && d.checks[id]))) out.push(id);
    });
    return out;
  }
  function pickSpell() {
    var pool = spellPool(), inPool = {};
    pool.forEach(function (id) { inPool[id] = 1; });
    for (var i = 0; i < SPL.retry.length; i++) {
      var r = SPL.retry[i];
      if (r.at <= SPL.n && inPool[r.id] && r.id !== SPL.id) { SPL.retry.splice(i, 1); return r.id; }
    }
    if (!pool.length) return -1;
    var fresh = pool.filter(function (id) { return id !== SPL.id && SPL.recent.indexOf(id) < 0; });
    var from = fresh.length ? fresh : pool.filter(function (id) { return id !== SPL.id; });
    if (!from.length) from = pool;
    return from[Math.floor(Math.random() * from.length)];
  }
  function nextSpell() {
    if (SPL.id >= 0) { SPL.recent.push(SPL.id); if (SPL.recent.length > 40) SPL.recent.shift(); }
    SPL.id = pickSpell();
    SPL.state = "ask";
    SPL.typed = "";
    SPL.focus = true;
  }
  // 대소문자, 띄어쓰기, 붙임표, 빗금, 점은 따지지 않는다 (gastr/o = gastro, b.i.d. = bid)
  function spellNorm(x) { return String(x).toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function spellHint(id) {
    var t = W[id][0];
    if (W[id][6] === 1 || t.length <= 24) return t.replace(/[A-Za-z0-9]/g, "_");
    return spellNorm(t).length + "글자";
  }
  function spellRecord(ok) {
    var dd = day(), cur = (dd && dd.spell) || { n: 0, ok: 0 };
    markStudied({ spell: { n: (cur.n || 0) + 1, ok: (cur.ok || 0) + (ok ? 1 : 0) } });
  }
  function spellAnswer(typed, skip) {
    var w = W[SPL.id];
    SPL.typed = skip ? "" : String(typed || "").trim();
    if (!skip && !SPL.typed) { SPL.focus = true; return; }
    var ok = !skip && spellNorm(SPL.typed) === spellNorm(w[0]);
    SPL.state = ok ? "ok" : skip ? "skip" : "no";
    SPL.n++;
    if (ok) SPL.ok++;
    else SPL.retry.push({ id: SPL.id, at: SPL.n + 4 });
    spellRecord(ok);
  }
  function spellHTML() {
    if (SPL.id >= 0 && !spellHide()[SPL.id] && spellPool().indexOf(SPL.id) < 0) SPL.id = -1; // 백업을 불러와서 없어진 단어
    if (SPL.id < 0 && !SPL.showHidden) nextSpell();
    var hid = hiddenIds();
    var head = '<header class="hdr"><span class="hdr-date">연습할 단어 ' + num(spellPool().length) + "개 · 숨긴 단어 " + hid.length + "개</span><h1>스펠링</h1></header>";
    if (SPL.showHidden) {
      var rows = hid.map(function (id) {
        return '<div class="row"><div class="row-l"><span class="w" lang="en">' + esc(W[id][0]) + '</span><span class="m">' + esc(W[id][1]) + "</span></div>" +
          '<div class="tog"><button data-act="spunhide" data-v="' + id + '" type="button">다시 보기</button></div></div>';
      }).join("");
      return head + '<button class="link" data-act="splist" type="button" style="align-self:flex-start">← 스펠링으로</button>' +
        (rows ? '<div class="rows">' + rows + "</div>" : '<section class="card-s"><p class="p">숨긴 단어가 없어요.</p></section>');
    }
    if (SPL.id < 0) {
      return head + '<section class="card-s"><h2 class="card-h">아직 연습할 단어가 없어요</h2>' +
        '<p class="meta">카드로 본 단어, 외운 단어, 아는 단어로 뺀 단어가 여기에 나와요.</p>' +
        '<div class="btn-row" style="grid-template-columns:1fr"><button class="btn primary" data-act="go" data-v="cards" type="button">오늘 단어 카드로 보기</button></div></section>' +
        (hid.length ? '<button class="link" data-act="splist" type="button">숨긴 단어 ' + hid.length + "개</button>" : "");
    }
    var id = SPL.id, w = W[id], answered = SPL.state !== "ask", good = SPL.state === "ok";
    var hasBlank = w[6] !== 1 && !!findEx(id);
    var hidden = !!spellHide()[id];
    var fb = !answered ? "" :
      '<div class="sp-fb ' + (good ? "ok" : "no") + '"><span class="res">' + (good ? "맞았어요" : SPL.state === "skip" ? "정답" : "틀렸어요") + "</span>" +
      '<span class="sp-ans" lang="en">' + esc(w[0]) + "</span>" +
      (SPL.state === "no" ? '<span class="sp-typed" lang="en">' + esc(SPL.typed) + "</span>" : "") + "</div>";
    var buttons = !answered
      ? '<button class="btn" data-act="spskip" type="button">정답 보기</button><button class="btn primary" data-act="spcheck" type="button">확인</button>'
      : good ? '<button class="btn primary" data-act="spnext" type="button" style="grid-column:1 / -1">다음 단어</button>'
             : '<button class="btn" data-act="spretry" type="button">다시 쓰기</button><button class="btn primary" data-act="spnext" type="button">다음 단어</button>';
    return head +
      '<section class="card-s sp-card">' +
        '<div class="sp-top"><span class="pos">' + esc(catShort(id)) + "</span>" +
          (canSpeak ? '<button class="speak" data-act="speak" data-v="' + id + '" type="button">' + ICON_SPEAK + "발음 듣기</button>" : "") + "</div>" +
        '<div class="sp-mean">' + esc(w[1]) + "</div>" +
        (hasBlank ? '<div class="example sp-ex" lang="en">' + markEx(id, !answered) + '</div><div class="ex-ko" style="margin-top:-8px">' + esc(w[5]) + "</div>" : answered ? exampleHTML(id) : "") +
        (answered ? partsHTML(id, true) : "") +
        '<form id="spell-form" class="sp-form" autocomplete="off">' +
          '<input id="spell-in" class="sp-in" type="text" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done"' +
          ' placeholder="' + esc(spellHint(id)) + '" value="' + esc(answered ? SPL.typed : "") + '"' + (answered ? " readonly" : "") + ">" +
        "</form>" + fb + (answered ? memoView(id) : "") +
      "</section>" +
      '<div class="btn-row">' + buttons + "</div>" +
      // 버튼 아래에 두어 '다음 단어' 버튼이 밀리지 않게 한다. 누르면 바로 사라지고, 알림의 '되돌리기'로 돌린다.
      (hidden ? "" : '<label class="sp-hide sp-opt"><input type="checkbox" data-act="sphide" data-v="' + id + '">이 단어 다시 보지 않기</label>') +
      '<div class="sp-foot"><span>이번에 ' + SPL.ok + " / " + SPL.n + ' 맞힘</span><button class="link" data-act="splist" type="button">숨긴 단어 ' + hid.length + "개</button></div>";
  }

  /* ---------- 백업 ---------- */
  var BK = { tab: "out", text: "", parsed: null, err: "", showText: false };
  function backupData() {
    return { app: "medvocab", v: 1, at: new Date().toISOString(), day: today, version: VERSION, words: P.WORD_COUNT, state: S, notes: NOTES };
  }
  function backupName() { return "의학용어-백업-" + today + ".json"; }
  function parseBackup(text) {
    var o;
    try { o = JSON.parse(String(text || "").trim()); } catch (e) { return null; }
    if (!o || typeof o !== "object") return null;
    var st = o.state && typeof o.state === "object" ? o.state : (o.words && o.days ? o : null);
    if (!st || typeof st.words !== "object" || typeof st.days !== "object") return null;
    if (o.app && o.app !== "medvocab") return null;
    var s = P.normalize(clone(st)), notes = o.notes && typeof o.notes === "object" ? o.notes : {};
    var nt = {};
    Object.keys(notes).forEach(function (k) { if (+k >= 0 && +k < W.length && typeof notes[k] === "string" && notes[k]) nt[k] = notes[k].slice(0, MEMO_MAX); });
    var on = o.day || (o.at ? String(o.at).slice(0, 10) : "");
    return { state: s, notes: nt, on: /^\d{4}-\d{2}-\d{2}$/.test(on) ? on : "", stats: P.stats(s, today), noteCount: Object.keys(nt).length };
  }
  function bkSummary(st, nNotes) {
    return "외운 단어 " + st.learned + "개 · 공부한 날 " + st.studyDays + "일" + (nNotes ? " · 메모 " + nNotes + "개" : "");
  }
  function backupHTML() {
    var out = BK.tab === "out";
    var tabs = '<div class="seg2"><button data-act="bktab" data-v="out" aria-pressed="' + out + '">내보내기</button>' +
      '<button data-act="bktab" data-v="in" aria-pressed="' + !out + '">불러오기</button></div>';
    var head = '<header class="hdr"><button class="link" data-act="tab" data-v="settings" style="padding:0;min-height:32px;align-self:flex-start">‹ 설정</button><h1>백업</h1></header>';
    if (out) {
      var st = P.stats(S, today);
      return head + tabs +
        '<section class="card-s"><h2 class="card-h">지금 기록</h2><p class="meta">' + bkSummary(st, noteIds().length) + "</p>" +
          '<div class="btn-col"><button class="btn primary" data-act="bksave" type="button">파일로 저장</button>' +
          '<button class="btn" data-act="bkcopy" type="button">복사하기</button></div>' +
          (M.lastBackup ? '<p class="meta" style="margin:0">마지막 백업 ' + md(M.lastBackup) + "</p>" : "") + "</section>" +
        (BK.showText ? '<section class="card-s"><textarea class="bk-text" readonly id="bk-out">' + esc(JSON.stringify(backupData())) + "</textarea></section>" : "");
    }
    if (BK.parsed) {
      var p = BK.parsed;
      return head + tabs +
        '<section class="card-s soft"><h2 class="card-h">' + (p.on ? md(p.on) + "에 만든 백업" : "백업") + '</h2><p class="meta">' + bkSummary(p.stats, p.noteCount) + "</p>" +
          '<p class="meta" style="margin:0">지금 기록(' + bkSummary(P.stats(S, today), noteIds().length) + ")은 이 백업으로 바뀌어요.</p>" +
          '<div class="btn-row"><button class="btn" data-act="bkcancel" type="button">취소</button><button class="btn primary" data-act="bkapply" type="button">이 백업으로 바꾸기</button></div></section>';
    }
    return head + tabs +
      '<section class="card-s"><div class="btn-col"><button class="btn primary" data-act="bkfile" type="button">백업 파일 고르기</button></div></section>' +
      '<section class="card-s"><textarea class="bk-text" id="bk-in" placeholder="복사해 둔 백업 내용을 붙여 넣으세요">' + esc(BK.text) + "</textarea>" +
        (BK.err ? '<p class="note" style="margin:0">' + esc(BK.err) + "</p>" : "") +
        '<div class="btn-col"><button class="btn" data-act="bkpaste" type="button">붙여 넣은 내용 확인</button></div></section>';
  }
  function backupSaved() { M.lastBackup = today; delete M.backupSnooze; saveMeta(); }
  function downloadText(text, name) {
    var blob = new Blob([text], { type: "application/json" }), url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  function exportBackup() {
    var text = JSON.stringify(backupData()), name = backupName(), file = null;
    try { file = new File([text], name, { type: "application/json" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      var can = false;
      try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        navigator.share({ files: [file], title: name }).then(function () {
          backupSaved(); render(); toast("백업 파일을 보냈어요. ‘파일’ 앱이나 메일에 잘 들어갔는지 확인해 주세요.");
        }).catch(function (e) {
          if (e && e.name === "AbortError") return;
          downloadText(text, name); backupSaved(); render(); toast("백업 파일을 저장했어요.");
        });
        return;
      }
    }
    downloadText(text, name);
    backupSaved(); render();
    toast("백업 파일을 저장했어요: " + name);
  }
  function copyBackup() {
    var text = JSON.stringify(backupData());
    var done = function () { backupSaved(); render(); toast("백업 내용을 복사했어요. 메모 앱이나 카카오톡 ‘나와의 채팅’에 붙여 두세요."); };
    var fallback = function () { BK.showText = true; render(); var t = document.getElementById("bk-out"); if (t) { t.focus(); t.select(); } toast("아래 글을 길게 눌러 전체 선택한 뒤 복사하세요."); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function tryBackupText(text) {
    var p = parseBackup(text);
    if (!p) { BK.err = "의학용어 단어장 백업이 아니에요. 내용을 끝까지 다 붙여 넣었는지 확인해 주세요."; BK.parsed = null; }
    else { BK.err = ""; BK.parsed = p; }
    render();
    window.scrollTo(0, 0);
  }
  $file.addEventListener("change", function () {
    var f = $file.files && $file.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { BK.tab = "in"; tryBackupText(String(r.result || "")); $file.value = ""; };
    r.onerror = function () { BK.err = "파일을 읽지 못했어요."; render(); $file.value = ""; };
    r.readAsText(f);
  });
  function applyBackup() {
    var p = BK.parsed;
    if (!p) return;
    var prevS = clone(S), prevN = clone(NOTES);
    S = p.state; NOTES = p.notes;
    migrate();
    ensurePlanNow();
    writeAll(); saveNotes();
    BK = { tab: "out", text: "", parsed: null, err: "", showText: false };
    SPL.id = -1; SPL.retry = []; SPL.recent = [];
    ui = { view: "home" };
    render();
    window.scrollTo(0, 0);
    toast("백업을 불러왔어요.", function () { S = prevS; NOTES = prevN; writeAll(); saveNotes(); render(); });
  }

/* ---- src/app/4-actions.js ---- */
  /* ---------- 동작 ---------- */
  function go(v) {
    var its = items();
    memoFor = null;
    if (v === "marks-keep" || v === "marks-memo") { ui = { view: "marks", marks: { tab: v === "marks-keep" ? "keep" : "memo" } }; render(); window.scrollTo(0, 0); return; }
    if (v === "backup" || v === "backup-in") { BK = { tab: v === "backup" ? "out" : "in", text: "", parsed: null, err: "", showText: false }; ui = { view: "backup" }; render(); window.scrollTo(0, 0); return; }
    if (v === "known") ui = { view: "known", known: { tab: "pick", sel: {}, limit: 30 } };
    else if (v === "cards") ui = { view: "cards", cards: { i: 0, show: false, done: false } };
    else if (v === "quiz") ui = { view: "quiz", quiz: buildQuiz(its.filter(function (x) { return seenCard(x.id); }).map(function (x) { return x.id; })) };
    else if (v === "check") ui = { view: "check", check: { i: 0, show: false, list: false, after: null } };
    else ui = { view: v };
    render();
    window.scrollTo(0, 0);
  }
  function act(a, el) {
    var v = el.getAttribute("data-v");
    if (a === "dismiss") { notice = ""; noticeUndo = null; renderNotice(); return; }
    if (a === "undo") { var f = noticeUndo; notice = ""; noticeUndo = null; renderNotice(); if (f) f(); return; }
    if (!S) return;
    if (a === "tab") { memoFor = null; ui = { view: v }; render(); window.scrollTo(0, 0); return; }
    if (a === "next" || a === "prev" || a === "mark" || a === "cnext" || a === "qnext") memoFor = null;
    if (a === "flag") {
      var fid = +v, fon = !isFlagged(fid), fp = { flags: {} };
      fp.flags[fid] = fon ? 1 : 0;
      save(fp);
      toast(fon ? "복습 탭 ‘계속 보기’에 넣었어요: " + W[fid][0] : "계속 보기에서 뺐어요: " + W[fid][0]);
      render();
      return;
    }
    if (a === "memo") { memoFor = memoFor === +v ? null : +v; memoFocus = memoFor !== null; render(); return; }
    if (a === "memocancel") { memoFor = null; render(); return; }
    if (a === "memosave" || a === "memodel") {
      var mid = +v, mEl = document.getElementById("memo-in");
      var mt = a === "memodel" ? "" : String(mEl ? mEl.value : "").trim().slice(0, MEMO_MAX);
      saveNote(mid, mt);
      memoFor = null;
      toast(mt ? "메모를 저장했어요." : "메모를 지웠어요.");
      render();
      return;
    }
    if (a === "mtab") { if (ui.marks) ui.marks.tab = v; memoFor = null; render(); return; }
    if (a === "go") { go(v); return; }
    if (a === "speak") { speak(+v); return; }
    if (a === "known1") {
      applyKnown([+v]);
      if (ui.view === "cards") ui.cards.show = false;
      if (ui.view === "check") ui.check.show = false;
      render();
      return;
    }
    if (a === "hideinstall") { M.hideInstall = 1; saveMeta(); render(); return; }
    if (a === "bksnooze") { M.backupSnooze = P.addDays(today, 7); saveMeta(); render(); return; }
    if (a === "snooze") { save({ adapt: { snooze: P.addDays(today, 3) } }); render(); return; }
    if (a === "easier") {
      var prevS = clone(S), lo = lowerPerDay();
      if (!lo) return;
      S = P.replanToday(S, today, lo).state;
      S.adapt = { snooze: P.addDays(today, 3) };
      writeAll();
      render();
      toast("하루 새 단어를 " + lo + "개로 줄였어요.", function () { S = prevS; writeAll(); render(); });
      return;
    }
    // 복습 탭
    if (a === "rvscope") { RV.scope = v; render(); return; }
    if (a === "rvsize") { RV.size = +v; render(); return; }
    if (a === "rvcards" || a === "rvquiz") {
      var rids = ui.view === "cards" && ui.cards.list ? ui.cards.list.map(function (x) { return x.id; }) : reviewPick();
      if (!rids.length) return;
      memoFor = null;
      if (a === "rvcards") ui = { view: "cards", from: "review", cards: { i: 0, show: false, done: false, list: rids.map(function (id) { return { id: id, kind: "review" }; }) } };
      else { var rq = buildQuiz(rids); rq.review = true; ui = { view: "quiz", from: "review", quiz: rq }; }
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (a === "perday") {
      var n = +v;
      if (n === S.settings.newPerDay) return;
      S = P.replanToday(S, today, n).state;
      writeAll();
      render();
      return;
    }
    if (ui.view === "backup") {
      if (a === "bktab") { BK.tab = v; BK.parsed = null; BK.err = ""; }
      else if (a === "bksave") { exportBackup(); return; }
      else if (a === "bkcopy") { copyBackup(); return; }
      else if (a === "bkfile") { $file.click(); return; }
      else if (a === "bkpaste") { var ta = document.getElementById("bk-in"); BK.text = ta ? ta.value : ""; tryBackupText(BK.text); return; }
      else if (a === "bkcancel") { BK.parsed = null; }
      else if (a === "bkapply") { applyBackup(); return; }
      render();
      return;
    }
    if (ui.view === "book") {
      if (a === "wbopen") { WB.open = WB.open === +v ? -1 : +v; memoFor = null; }
      else if (a === "wbf") { WB.f = v; WB.limit = 50; WB.open = -1; memoFor = null; }
      else if (a === "wbmore") WB.limit += 50;
      render();
      return;
    }
    if (ui.view === "spell") {
      if (a === "spcheck") { var spi = document.getElementById("spell-in"); spellAnswer(spi ? spi.value : "", false); }
      else if (a === "spskip") spellAnswer("", true);
      else if (a === "spnext") nextSpell();
      else if (a === "spretry") { SPL.state = "ask"; SPL.typed = ""; SPL.focus = true; }
      else if (a === "sphide") {
        var hp = { spell: { hide: {} } };
        hp.spell.hide[v] = 1;
        save(hp);
        toast("스펠링에 다시 나오지 않아요: " + W[+v][0], function () { var up2 = { spell: { hide: {} } }; up2.spell.hide[v] = 0; save(up2); render(); });
      }
      else if (a === "splist") SPL.showHidden = !SPL.showHidden;
      else if (a === "spunhide") { var up = { spell: { hide: {} } }; up.spell.hide[v] = 0; save(up); }
      render();
      return;
    }
    if (ui.view === "known") {
      var kk = ui.known;
      if (a === "ktab") kk.tab = v;
      else if (a === "ksel") { if (kk.sel[v]) delete kk.sel[v]; else kk.sel[v] = 1; }
      else if (a === "kmore") kk.limit += 30;
      else if (a === "kapply") { var ks = Object.keys(kk.sel).map(Number); if (ks.length) { applyKnown(ks); kk.sel = {}; } }
      else if (a === "kundo") { S = P.unmarkKnown(S, today, +v); writeAll(); toast("다시 배울 단어로 돌렸어요: " + W[+v][0]); }
      render();
      return;
    }
    if (ui.view === "cards") {
      var c = ui.cards;
      if (a === "flip") c.show = !c.show;
      else if (a === "prev" && c.i > 0) { c.i--; c.show = false; }
      else if (a === "next") cardsNext();
      else if (a === "cagain") { c.i = 0; c.show = false; c.done = false; }
      render();
      return;
    }
    if (ui.view === "quiz") {
      var q = ui.quiz;
      if (a === "pick" && q.picked < 0) {
        q.picked = +v;
        var cur = q.qs[q.i];
        if (cur.opts[q.picked] === cur.id) q.right++;
        else { q.wrongQs.push({ id: cur.id, from: cur.from }); if (cur.from < 0) q.wrong.push(cur.id); }
      } else if (a === "qnext") {
        if (q.i < q.qs.length - 1) { q.i++; q.picked = -1; }
        else {
          q.done = true;
          if (q.review) markStudied();
          else if (!q.retry) markStudied({ quiz: { right: q.right, total: q.qs.length, wrong: q.wrong.slice() } });
        }
      } else if (a === "qretry") {
        var rv = q.review;
        ui.quiz = buildQuiz(null, q.wrongQs);
        ui.quiz.review = rv;
      }
      render();
      return;
    }
    if (ui.view === "check") {
      var ck = ui.check;
      if (a === "flip") ck.show = !ck.show;
      else if (a === "clist") ck.list = !ck.list;
      else if (a === "mark") {
        var its = items(), at = ck.after != null ? ck.after : its[ck.i].id;
        var p = { checks: {} }; p.checks[at] = v;
        markStudied(p);
        if (v === "y" && ck.after == null && !ck.show) ck.after = at;   // 뜻을 보여 주고 '넘어가기'를 기다린다
        else { ck.after = null; ck.show = false; ck.i = ck.i + 1; }
      } else if (a === "cnext") {
        ck.after = null; ck.show = false; ck.i = ck.i + 1;
      } else if (a === "cset") {
        var id = el.getAttribute("data-id");
        var p2 = { checks: {} }; p2.checks[id] = v;
        markStudied(p2);
      }
      render();
    }
  }

  // 다음 카드로. 마지막 카드면 끝 (오늘 카드는 '완료'로, 복습 카드는 공부한 날로만 남긴다)
  function cardsNext() {
    var c = ui.cards, its = cardList();
    if (c.i < its.length - 1) { c.i++; c.show = false; return; }
    c.done = true;
    if (c.list) markStudied();
    else if (!day().cards) markStudied({ cards: 1 });
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    // 카드 안의 듣기 버튼은 카드 뒤집기와 따로 동작
    if (el.getAttribute("data-act") === "speak") e.stopPropagation();
    act(el.getAttribute("data-act"), el);
  });
  document.addEventListener("keydown", function (e) {
    if (!S) return;
    var t = e.target;
    if (t && t.tagName === "TEXTAREA") return;
    if (t && t.id === "wb-q") { if (e.key === "Enter") { t.blur(); e.preventDefault(); } return; }
    if (ui.view === "spell" && e.key === "Enter" && SPL.state !== "ask" && !e.isComposing) { nextSpell(); render(); e.preventDefault(); return; }
    if (ui.view === "cards" && !ui.cards.done) {
      if (e.key === "ArrowRight") { act(ui.cards.show ? "next" : "flip", t); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { act("prev", t); e.preventDefault(); }
      else if ((e.key === " " || e.key === "Enter") && t.classList && t.classList.contains("card")) { act("flip", t); e.preventDefault(); }
    } else if (ui.view === "check" && (e.key === " " || e.key === "Enter") && t.classList && t.classList.contains("card")) { act("flip", t); e.preventDefault(); }
  });
  document.addEventListener("input", function (e) {
    var q = e.target;
    if (!q) return;
    if (q.id === "wb-q") {
      WB.q = q.value;
      WB.limit = 50;
      WB.open = -1;
      clearTimeout(wbTimer);
      wbTimer = setTimeout(function () { var el = document.getElementById("wb-list"); if (el && S) el.innerHTML = bookListHTML(); }, 120);
    } else if (q.id === "memo-in") {
      var n = document.getElementById("memo-n");
      if (n) n.textContent = num(q.value.length);
      q.style.height = "auto";
      q.style.height = Math.min(q.scrollHeight + 4, Math.round(window.innerHeight * 0.55)) + "px";
    } else if (q.id === "bk-in") {
      BK.text = q.value;
    }
  });
  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "spell-form") return;
    e.preventDefault();
    if (!S || ui.view !== "spell") return;
    if (SPL.state === "ask") { var spi = document.getElementById("spell-in"); spellAnswer(spi ? spi.value : "", false); }
    else nextSpell();
    render();
  });
  // 카드 화면에서 옆으로 밀어 넘기기
  var touchX = null, touchY = null;
  document.addEventListener("touchstart", function (e) { if (ui.view !== "cards") return; touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (ui.view !== "cards" || touchX === null || ui.cards.done) return;
    var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    var c = ui.cards;
    if (dx < 0) cardsNext();
    else if (c.i > 0) { c.i--; c.show = false; }
    render();
  }, { passive: true });

  // 시작
  load();
  render();
  // 인터넷이 없어도 열리도록 파일을 저장해 둔다 (https 또는 내 컴퓨터에서만)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { /* 오프라인 저장 없이도 앱은 동작 */ }); });
  }
})();

</script>
