<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의학용어 단어장</title>
<meta name="description" content="보건행정학과 의학용어와 보건의료정보관리사 시험 범위를 하루 몇 개씩 외우는 단어장">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="의학용어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* 의학용어 단어장 (참고: 아침 단어장): iOS 묶음 목록처럼 조용하게. 읽는 것은 위, 누르는 것은 엄지가 닿는 아래. 강조색은 남색 하나. 글꼴은 시스템 글꼴만. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #ECEEF3;
  --ink: #15181F;
  --muted: #676D7E;
  --faint: #A0A5B2;
  --line: #E3E5EB;
  --accent: #33468A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6E9F6;
  --ok: #2B7655;
  --ok-ink: #FFFFFF;
  --ok-soft: #E1F0E8;
  --no: #B0453C;
  --no-soft: #F7E6E3;
  --rev: #8A640E;
  --rev-soft: #F5EDDA;
  --f-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --f-word: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 16px;
  --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F14; --surface: #1A1C23; --surface-2: #262935; --ink: #ECEDF2; --muted: #9EA3B1; --faint: #6C7181; --line: #2C2F3A;
    --accent: #A9B6EE; --accent-ink: #11152A; --accent-soft: #232A47;
    --ok: #7CC9A2; --ok-ink: #0E1D16; --ok-soft: #1A3126; --no: #EC978E; --no-soft: #3A2224; --rev: #E3BE6C; --rev-soft: #33291A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F14; --surface: #1A1C23; --surface-2: #262935; --ink: #ECEDF2; --muted: #9EA3B1; --faint: #6C7181; --line: #2C2F3A;
  --accent: #A9B6EE; --accent-ink: #11152A; --accent-soft: #232A47;
  --ok: #7CC9A2; --ok-ink: #0E1D16; --ok-soft: #1A3126; --no: #EC978E; --no-soft: #3A2224; --rev: #E3BE6C; --rev-soft: #33291A;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.5; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; letter-spacing: inherit; touch-action: manipulation; }
.card { touch-action: manipulation; }
button:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
b, .num { font-variant-numeric: tabular-nums; }
.p { margin: 0; font-size: 14px; color: var(--muted); }

#app {
  max-width: 480px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
#view { display: flex; flex-direction: column; gap: 12px; }

/* 머리 */
.hdr { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 4px 2px; }
.hdr-date { font-size: 13px; color: var(--muted); font-weight: 500; }
.hdr h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
.lvchip { appearance: none; border: 0; margin-top: 8px; padding: 6px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
.sec-label { margin: 8px 4px -4px; font-size: 13px; font-weight: 600; color: var(--muted); }

/* 카드 */
.card-s { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-s.soft { background: var(--accent-soft); }
.card-h { margin: 0; font-size: 17px; font-weight: 700; }
.meta { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.counts { display: grid; grid-template-columns: 1fr 1fr; }
.count b { display: block; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
.count span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.count.new b { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-word); font-size: 15px; line-height: 1.4; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); }
.chip.again { background: var(--no-soft); color: var(--no); }
.chip.review { background: var(--rev-soft); color: var(--rev); }
.chip.more { font-family: var(--f-ui); background: transparent; color: var(--muted); padding-inline: 2px; }
.btn-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.ok { background: var(--ok); }
.bar i.soft { background: var(--accent-soft); }
.bar i.kn { background: var(--faint); }

/* 묶음 목록 */
.group { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.cell { appearance: none; border: 0; background: transparent; width: 100%; box-sizing: border-box; min-height: 54px; padding: 8px 12px 8px 16px; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; position: relative; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }
.cell-t { flex: 1; min-width: 0; font-size: 16px; }
.cell-v { font-size: 15px; color: var(--muted); white-space: nowrap; }
.cell svg { width: 16px; height: 16px; color: var(--faint); flex: none; }
.cell.now .cell-t { font-weight: 700; }
button.cell:active { background: var(--surface-2); }
div.cell { cursor: default; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; }
.link { appearance: none; border: 0; background: transparent; cursor: pointer; align-self: center; min-height: 44px; padding: 0 12px; font-size: 15px; color: var(--accent); font-weight: 500; }

/* 기록 요약 (홈) */
.rec { appearance: none; border: 0; text-align: left; cursor: pointer; width: 100%; box-sizing: border-box; }
.rec-nums { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
.rec-nums b { font-size: 20px; color: var(--ink); font-weight: 700; margin-right: 3px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); box-sizing: border-box; display: grid; place-items: center; }
.dot.on { background: var(--accent); }
.dot.on::after { content: ""; width: 8px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg); }
.dot.today { box-shadow: inset 0 0 0 2px var(--accent); }
.dot.future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.week.big .dot { width: 32px; height: 32px; }
.week.big .d { font-size: 12px; gap: 6px; }

/* 기록 화면 */
.stats { background: var(--surface); border-radius: var(--r); display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 0; }
.stat { text-align: center; min-width: 0; padding: 0 4px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font-size: 26px; font-weight: 700; line-height: 1.2; }
.stat b small { font-size: 14px; font-weight: 600; margin-left: 1px; }
.stat span { font-size: 12px; color: var(--muted); }
.ladder { display: flex; flex-direction: column; gap: 12px; }
.rung { display: grid; grid-template-columns: 84px 1fr 56px; gap: 10px; align-items: center; }
.rung .nm { font-size: 12px; color: var(--muted); line-height: 1.3; min-width: 0; }
.rung .nm b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.rung.now .nm b { color: var(--accent); }
.rung .ct { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.ladder-sep { border-top: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 1px; }
.grid4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.grid4 .c { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); }
.grid4 .c.on { background: var(--accent); }
.grid4 .c.future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.grid4 .h { font-size: 11px; color: var(--muted); text-align: center; }
.upc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 88px; }
.upc .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.upc .col i { display: block; width: 60%; max-width: 22px; border-radius: 4px 4px 2px 2px; background: var(--rev); min-height: 2px; }
.upc .col i.zero { background: var(--line); }
.upc .col b { font-size: 12px; }
.upc .col span { font-size: 11px; color: var(--muted); }

/* 설정 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 11px; }
.seg button { appearance: none; border: 0; cursor: pointer; min-height: 40px; border-radius: 9px; background: transparent; font-size: 16px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.stepper button { appearance: none; border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); font-size: 22px; font-weight: 500; color: var(--accent); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .val { text-align: center; }
.stepper .val b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; }
.stepper .val span { font-size: 13px; color: var(--muted); }
details.card-s summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; min-height: 24px; }
details.card-s summary::-webkit-details-marker { display: none; }
details.card-s summary::after { content: "+"; color: var(--faint); font-size: 20px; font-weight: 400; }
details.card-s[open] summary::after { content: "−"; }
.rules { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }

/* 하단 탭 */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tab-h); }
.tab { appearance: none; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--faint); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

/* 공부 화면 (전체 화면) */
.study {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 6px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.study-in { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.study-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 44px; }
.study-top .mid { font-size: 15px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.study-top .right { justify-self: end; }
.back { appearance: none; border: 0; background: transparent; cursor: pointer; justify-self: start; min-height: 44px; padding: 0 4px; font-size: 16px; color: var(--accent); display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.back svg { width: 20px; height: 20px; margin-left: -4px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.again { background: var(--no-soft); color: var(--no); }
.tag.review { background: var(--rev-soft); color: var(--rev); }
.progress { height: 3px; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex: none; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.study-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
.study-body > * { flex-shrink: 0; }
.study-body.center { justify-content: center; }
.study-body.end { justify-content: flex-end; }
.study-foot { display: grid; gap: 8px; flex: none; }
.study-foot.two { grid-template-columns: 1fr 1fr; }
.study-foot.wide { grid-template-columns: 1fr 1.6fr; }

.card {
  background: var(--surface); border-radius: 20px;
  padding: 24px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  min-height: 260px; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none;
}
.card-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pos { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.word { font-family: var(--f-word); font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.word.s2 { font-size: 32px; } .word.s3 { font-size: 27px; } .word.s4 { font-size: 23px; }
.speak { appearance: none; border: 0; background: var(--surface-2); color: var(--ink); cursor: pointer; min-height: 36px; padding: 0 14px; border-radius: 99px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.speak svg { width: 16px; height: 16px; }
.reveal { display: flex; flex-direction: column; gap: 6px; align-items: center; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line); width: 100%; }
.meaning { font-size: 22px; font-weight: 700; line-height: 1.35; }
.example { font-family: var(--f-word); font-size: 16px; color: var(--muted); line-height: 1.45; letter-spacing: 0; }
.example b { color: var(--ink); }
.hint { font-size: 13px; color: var(--faint); padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line); width: 100%; }
.note { font-size: 13px; color: var(--no); }

.btn { appearance: none; border: 0; cursor: pointer; min-height: 52px; border-radius: 14px; padding: 0 16px; font-size: 17px; font-weight: 600; background: var(--surface); color: var(--ink); white-space: nowrap; }
.card-s .btn:not(.primary) { background: var(--surface-2); }
.card-s.soft .btn:not(.primary) { background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); color: var(--ok-ink); min-height: 64px; font-size: 18px; }
.btn.no { background: var(--no-soft); color: var(--no); min-height: 64px; font-size: 18px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.known-btn { appearance: none; align-self: center; border: 0; background: transparent; cursor: pointer; min-height: 40px; padding: 0 12px; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

/* 퀴즈, 테스트 */
.q-head { text-align: center; padding: 12px 0 4px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.q-head .mini { font-size: 13px; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  appearance: none; cursor: pointer; text-align: left; width: 100%; min-height: 56px;
  padding: 10px 14px; border-radius: 14px; border: 2px solid transparent;
  background: var(--surface); font-size: 17px; line-height: 1.35;
  display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center;
}
.choice .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.right .n { background: var(--ok); color: var(--ok-ink); }
.choice.wrong { border-color: var(--no); background: var(--no-soft); }
.choice.wrong .n { background: var(--no); color: #fff; }
.choice:disabled { cursor: default; color: var(--ink); }
.choices .btn { background: transparent; color: var(--muted); font-weight: 500; min-height: 48px; }
.feedback { text-align: center; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.feedback .res { font-weight: 700; }
.feedback .res.ok { color: var(--ok); }
.feedback .res.no { color: var(--no); }

/* 결과, 목록 */
.done-h { text-align: center; display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
.done-h .mini { font-size: 13px; color: var(--muted); }
.done-h .big { font-size: 48px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.done-h h2 { margin: 0; font-size: 20px; font-weight: 700; }
.done-h .p { margin-top: 2px; }
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .w { font-family: var(--f-word); font-size: 17px; font-weight: 700; letter-spacing: 0; }
.row .w.ko { font-family: var(--f-ui); font-size: 15px; font-weight: 600; }
.row .m { font-size: 13px; color: var(--muted); display: block; }
.row-l { min-width: 0; }
.tog { display: flex; gap: 6px; }
.tog button { appearance: none; border: 1px solid var(--line); background: transparent; cursor: pointer; min-height: 40px; min-width: 60px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tog button.on-y { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.tog button.on-n { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.summary { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); background: var(--surface); border-radius: var(--r); padding: 14px 16px; }
.summary p { margin: 0; }
.summary .line { display: flex; gap: 16px; font-size: 16px; font-weight: 700; color: var(--ink); }
.summary .line .y { color: var(--ok); }
.summary .line .n { color: var(--no); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--surface-2); border-radius: 11px; padding: 3px; flex: none; }
.seg2 button { appearance: none; border: 0; cursor: pointer; min-height: 38px; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.kgroup { font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 16px 6px; background: var(--surface-2); }

.krow[aria-pressed="true"] .ck::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg); }
.krow .today { font-family: var(--f-ui); font-size: 11px; font-weight: 600; color: var(--accent); margin-left: 6px; }

/* 계속 보기, 메모 */
.w-acts { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }

.memo-ed textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; line-height: 1.5; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; min-height: 120px; max-height: 55vh; overflow-y: auto; }

.wb-chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

.wb-chip { flex: none; appearance: none; border: 0; cursor: pointer; min-height: 34px; padding: 0 12px; border-radius: 99px; background: var(--surface); font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.wb-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.wb-list { display: flex; flex-direction: column; gap: 10px; }
.wb-count { margin: 0 4px; }
.wb-item + .wb-item { border-top: 1px solid var(--line); }
.wb-row { appearance: none; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 1px; padding: 10px 14px 10px 16px; }
.wb-main { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.wb-row .w { font-family: var(--f-word); font-size: 17px; font-weight: 700; letter-spacing: 0; }
.wb-row .m { grid-column: 1; font-size: 14px; color: var(--muted); }
.wb-st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; font-weight: 600; color: var(--faint); white-space: nowrap; }
.wb-st.learning { color: var(--rev); }
.wb-st.done { color: var(--ok); }

.wb-tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
.wb-tag.note { color: var(--rev); background: var(--rev-soft); }
.wb-tag.keep { color: var(--ok); background: var(--ok-soft); }
.wb-item.open .wb-row { background: var(--accent-soft); }
.wb-detail { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.wb-detail .example { text-align: left; }
.wb-more { background: var(--surface); }

/* 스펠링 */
.sp-card { gap: 14px; }

.sp-typed { font-family: var(--f-word); font-size: 14px; color: var(--muted); text-decoration: line-through; }

/* 알림 띠, 불러오기 */
#notice { position: fixed; z-index: 40; left: 0; right: 0; top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
#notice .in { pointer-events: auto; max-width: 480px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 8px 10px 14px; font-size: 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }

.local { font-size: 13px; color: var(--rev); background: var(--rev-soft); border-radius: 12px; padding: 10px 12px; }
.skel { background: var(--surface); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 350px) {

}

/* 단어 구성 */

/* 복습 범위 고르기 (이름과 개수 두 줄) */

/* 복습: 건너뛴 단계 열기 */

.rv-lv button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8; }

/* 스펠링: 버튼 아래의 '다시 보지 않기' */
.sp-hide.sp-opt { border-top: 0; padding: 0 4px; margin: -4px 0 -8px; }
/* 복습 범위 4칸 */
.seg.seg-n button { padding: 0 2px; }

#app { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); }

window.WORDS=[["a-","없음, 아님","a- 없음 + -pnea 호흡 = apnea 무호흡",0,"The baby had apnea at night.","아기가 밤에 무호흡이 있었다.",1],["an-","없음","an- 없음 + -emia 혈액 상태 = anemia 빈혈",0,"She has anemia and feels tired.","그녀는 빈혈이 있어 피곤하다.",1],["ab-","~에서 떨어져","ab- 떨어져 + -duction 끌어감 = abduction 벌림",0,"Abduction moves the arm away from the body.","벌림은 팔을 몸에서 멀어지게 한다.",1],["ad-","~쪽으로","ad- 쪽으로 + -duction 끌어감 = adduction 모음",0,"Adduction moves the arm toward the body.","모음은 팔을 몸 쪽으로 움직인다.",1],["ante-","앞, 전","ante- 앞 + nat/o 출생 + -al ~의 = antenatal 출생 전의",0,"She goes to antenatal classes.","그녀는 출산 전 교실에 다닌다.",1],["anti-","대항, 반대","anti- 대항 + -biotic 생명에 관한 것 = antibiotic 항생제",0,"The doctor gave him an antibiotic.","의사가 그에게 항생제를 주었다.",1],["auto-","자기, 스스로","auto- 자기 + -immune 면역의 = autoimmune 자가면역의",0,"Lupus is an autoimmune disease.","루푸스는 자가면역 질환이다.",1],["bi-","둘","bi- 둘 + later/o 옆 + -al ~의 = bilateral 양쪽의",0,"He has bilateral knee pain.","그는 양쪽 무릎이 아프다.",1],["brady-","느린","brady- 느린 + cardi/o 심장 + -ia 상태 = bradycardia 서맥",0,"Bradycardia means a slow heart rate.","서맥은 심장 박동이 느린 것이다.",1],["con-","함께","con- 함께 + -genital 태어난 = congenital 선천성의",0,"The baby has a congenital heart problem.","아기는 선천성 심장 문제가 있다.",1],["contra-","반대, 대항","contra- 반대 + -ception 임신 = contraception 피임",0,"They talked about contraception.","그들은 피임에 대해 이야기했다.",1],["de-","제거, 아래로","de- 제거 + hydr/o 물 + -ation 과정 = dehydration 탈수",0,"Dehydration can cause headaches.","탈수는 두통을 일으킬 수 있다.",1],["dia-","통과, 완전히","dia- 통과 + -lysis 분리 = dialysis 투석",0,"He gets dialysis three times a week.","그는 일주일에 세 번 투석을 받는다.",1],["dys-","나쁜, 어려운","dys- 어려운 + -pnea 호흡 = dyspnea 호흡곤란",0,"She has dyspnea when she walks.","그녀는 걸을 때 숨이 차다.",1],["ec-","밖","ec- 밖 + -topic 장소의 = ectopic 자리를 벗어난",0,"An ectopic pregnancy is dangerous.","자궁외 임신은 위험하다.",1],["ecto-","바깥","ecto- 바깥 + -derm 피부 = ectoderm 외배엽",0,"Skin comes from the ectoderm.","피부는 외배엽에서 생긴다.",1],["endo-","안, 속","endo- 안 + -scope 보는 기구 = endoscope 내시경",0,"The doctor used an endoscope.","의사가 ole","세기관지","bronch/o 기관지 + -iole 작은 것",24,"A bronchiole is a small airway.","세기관지는 작은 기도이다.",3],["alveolus","허파꽈리, 폐포","alveol/o 작은 구멍 + -us 것",24,"Oxygen enters the blood in each alveolus.","산소는 허파꽈리에서 피로 들어간다.",3],["trachea","기관, 숨통","trache/o 기관",24,"The trachea carries air to the lungs.","기관은 공기를 허파로 나른다.",3],["larynx","후두","laryng/o 후두",24,"The larynx holds the vocal cords.","후두에는 성대가 있다.",3],["pharynx","인두","pharyng/o 인두",24,"The pharynx is the back of the throat.","인두는 목구멍 뒤쪽이다.",3],["epiglottis","후두덮개","epi- 위 + glott/o 성문 + -is 것",24,"The epiglottis covers the airway when you swallow.","후두덮개는 삼킬 때 기도를 덮는다.",3],["pleura","가슴막, 흉막","pleur/o 가슴막",24,"The pleura covers the lungs.","가슴막은 허파를 감싼다.",3],["sinus","굴, 부비동","sinus 굽은 곳",24,"My sinus feels blocked.","굴이 막힌 느낌이다.",3],["respiration","호흡","re- 다시 + spir/o 호흡 + -ation 과정",24,"Respiration brings in oxygen.","호흡은 산소를 들여온다.",3],["inspiration","들숨","in- 안 + spir/o 호흡 + -ation 과정",24,"Take a deep inspiration.","숨을 깊이 들이쉬세요.",3],["expiration","날숨","ex- 밖으로 + spir/o 호흡 + -ation 과정",24,"Expiration pushes air out.","날숨은 공기를 내보낸다.",3],["asthma","천식","asthma 헐떡임",24,"She uses an inhaler for asthma.","그녀는 천식 때문에 흡입기를 쓴다.",3],["bronchitis","기관지염","bronch/o 기관지 + -itis 염증",24,"Smokers often get bronchitis.","흡연자는 기관지염에 자주 걸린다.",3],["pneumonia","폐렴","pneumon/o 허파 + -ia 상태",24,"Old people can die of pneumonia.","노인은 폐렴으로 사망할 수 있다.",3],["tuberculosis","결핵","tubercul/o 작은 혹 + -osis 상태",24,"Tuberculosis spreads through the air.","결핵은 공기로 퍼진다.",3],["emphysema","폐기종","emphysema 부풀림",24,"Emphysema is caused by smoking.","폐기종은 흡연 때문에 생긴다.",3],["chronic obstructive pulmonary disease","만성폐쇄폐질환","chronic 만성의 + obstructive 막는 + pulmonary 허파의 + disease 질환",24,"Chronic obstructive pulmonary disease makes breathing hard.","만성폐쇄폐질환은 숨쉬기를 어렵게 한다.",3],["pneumothorax","공기가슴증, 기흉","pneum/o 공기 + thorax 가슴",24,"A tall young man can get a pneumothorax.","키 큰 젊은 남자에게 기흉이 생길 수 있다.",3],["pleural effusion","가슴막삼출, 흉막삼출","pleur/o 가슴막 + -al ~의 + ef c ulcer","위궤양","gastr/o 위 + -ic ~의 + ulcer 궤양",25,"A gastric ulcer can bleed.","위궤양은 피가 날 수 있다.",3],["peptic ulcer","소화궤양","pept/o 소화 + -ic ~의 + ulcer 궤양",25,"A peptic ulcer causes burning pain.","소화궤양은 타는 듯한 통증을 일으킨다.",3],["gastroesophageal reflux disease","위식도역류병","gastr/o 위 + esophag/o 식도 + -eal ~의 + reflux 역류 + disease 질환",25,"Gastroesophageal reflux disease causes heartburn.","위식도역류병은 가슴쓰림을 일으킨다.",3],["gastroenteritis","위장염","gastr/o 위 + enter/o 장 + -itis 염증",25,"Bad food gave him gastroenteritis.","상한 음식 때문에 그는 위장염에 걸렸다.",3],["appendicitis","막창자꼬리염, 충수염","append/o 막창자꼬리 + -icitis 염증",25,"Appendicitis needs surgery.","막창자꼬리염은 수술이 필요하다.",3],["hepatitis","간염","hepat/o 간 + -itis 염증",25,"Hepatitis can turn the skin yellow.","간염은 피부를 노랗게 만들 수 있다.",3],["cirrhosis","간경화증","cirrh/o 황갈색 + -osis 상태",25,"Heavy drinking can cause cirrhosis.","과음은 간경화증을 일으킬 수 있다.",3],["cholecystitis","쓸개염, 담낭염","chol/e 쓸개즙 + cyst/o 주머니 + -itis 염증",25,"Cholecystitis causes pain under the right ribs.","쓸개염은 오른쪽 갈비뼈 아래 통증을 일으킨다.",3],["cholelithiasis","쓸개돌증, 담석증","chol/e 쓸개즙 + lith/o 돌 + -iasis 상태",25,"Cholelithiasis means stones in the gallbladder.","쓸개돌증은 쓸개에 돌이 생긴 것이다.",3],["pancreatitis","이자염, 췌장염","pancreat/o 이자 + -itis 염증",25,"Pancreatitis causes very bad belly pain.","이자염은 아주 심한 복통을 일으킨다.",3],["colitis","잘록창자염, 대장염","col/o 잘록창자 + -itis 염증",25,"Colitis can cause diarrhea.","잘록창자염은 설사를 일으킬 수 있다.",3],["Crohn's disease","크론병","Crohn 의사 이름 + disease 질환",25,"Crohn's disease can affect any part of the gut.","크론병은 장의 어느 부분에나 생길 수 있다.",3],["irritable bowel syndrome","과민대장증후군","irritable 예민한 + bowel 창자 + syndrome 증후군",25,"Stress can trigger irritable bowel syndrome.","스트레스는 과민대장증후군을 일으킬 수 있다.",3],["hemorrhoids","치핵, 치질","hem/o 혈액 + -rrhoid 흐름 + -s 여럿",25,"Hemorrhoids can bleed.","치핵은 피가 날 수 있다.",3],["hernia","탈장","herni/o 탈장",25,"He has a hernia in his groin.","그는 샅에 탈장이 있다.",3],["polyp","폴립, 용종","polyp 발이 많은 것",25,"The doctor removed a polyp.","의사가 폴립을 떼어 냈다.",3],["diverticulitis","게실염","divertic e lab tested his serum.","검사실에서 그의 혈청을 검사했다.",3],["red blood cell","적혈구","red 붉은 + blood 혈액 + cell 세포",37,"A red blood cell carries oxygen.","적혈구는 산소를 나른다.",3],["white blood cell","백혈구","white 흰 + blood 혈액 + cell 세포",37,"A white blood cell fights infection.","백혈구는 감염과 싸운다.",3],["platelet","혈소판","plate 판 + -let 작은 것",37,"A platelet helps blood clot.","혈소판은 피가 굳도록 돕는다.",3],["hemoglobin","혈색소, 헤모글로빈","hem/o 혈액 + globin 단백질",37,"Hemoglobin carries oxygen in red cells.","혈색소는 적혈구 속에서 산소를 나른다.",3],["coagulation","응고","coagul/o 엉김 + -ation 과정",37,"Coagulation stops bleeding.","응고는 출혈을 멈춘다.",3],["anemia","빈혈","an- 없음 + -emia 혈액 상태",37,"Iron helps with anemia.","철분은 빈혈에 도움이 된다.",3],["iron deficiency anemia","철결핍빈혈","iron 철 + deficiency 부족 + anemia 빈혈",37,"Iron deficiency anemia is common in women.","철결핍빈혈은 여자에게 흔하다.",3],["aplastic anemia","재생불량빈혈","a- 없음 + plast/o 형성 + -ic ~의 + anemia 빈혈",37,"Aplastic anemia means the marrow makes few cells.","재생불량빈혈은 골수가 세포를 적게 만드는 것이다.",3],["leukemia","백혈병","leuk/o 흰 + -emia 혈액 상태",37,"Leukemia is treated with chemotherapy.","백혈병은 화학요법으로 치료한다.",3],["hemophilia","혈우병","hem/o 혈액 + -philia 경향",37,"Hemophilia is passed down in families.","혈우병은 집안 대대로 이어진다.",3],["thrombocytopenia","혈소판감소증","thromb/o 혈전 + cyt/o 세포 + -penia 감소",37,"Thrombocytopenia causes easy bruising.","혈소판감소증이 있으면 멍이 잘 든다.",3],["leukocytosis","백혈구증가증","leuk/o 흰 + cyt/o 세포 + -osis 증가",37,"Leukocytosis is a sign of infection.","백혈구증가증은 감염의 징후이다.",3],["sepsis","패혈증","sepsis 썩음",37,"Sepsis is a deadly blood infection.","패혈증은 치명적인 혈액 감염이다.",3],["immunity","면역","immun/o 면역 + -ity 상태",38,"A vaccine gives you immunity.","백신은 면역을 준다.",3],["antigen","항원","anti- 대항 + -gen 만드는 것",38,"An antigen makes the body make antibodies.","항원은 몸이 항체를 만들게 한다.",3],["antibody","항체","anti- 대항 + body 몸",38,"An antibody fights germs.","항체는 세균과 싸운다.",3],["lymph node","림프절","lymph/o 림프 + node 마디",38,"A lymph node can swell with infection.","림프절은 감염되면 부을 수 있다.",3],["spleen","지라, 비장","splen/o 지라",38,"The spleen filters blood.","지라는 피를 거른다.",3],["thymus","가슴샘, 흉선","thym/o 가슴샘 + -us 것",38,"The thymus helps T cells grow.","가슴샘은 T세포가 자라도록 돕는다.",3],["allergy","알레르기","all/o 다른 + erg/o 작용 + -y 상태",38,"She has an allergy to peanuts.","그녀는 땅콩 알레르기가 있다.",3],["anaphylaxis","아나필락시스, 과민증","ana- 거꾸로 + phylaxis 보호",38,"Anaphylaxis needs an epinephrine shot.","아나필락시스에는 에피네프린 주사가 필요하다.",3],["autoimmune disease","자가면역질환","auto- 자기 + immun/o 면역 + disease 질환",38,"Lupus is an autoimmune disease.","루푸스는 자가면역질환이다.",3],["systemic lupus erythematosus","전신홍반루푸스","systemic 전신의 + lupus 늑대 + erythemat/o 홍반 + -osus 많은",38,"Systemic lupus erythematosus can cause a face rash.","전신홍반루푸스는 얼굴 발진을 일으킬 수 있다.",3],["acquired immunodeficiency syndrome","후천면역결핍증후군","acquired 후천의 + immun/o 면역 + deficiency 결핍 + syndrome 증후군",38,"Acquired immunodeficiency syndrome is caused by HIV.","후천면역결핍증후군은 HIV 때문에 생긴다.",3],["infection","감염","in- 안 + fect 만듦 + -ion 것",38,"Wash your hands to prevent infection.","감염을 막으려면 손을 씻으세요.",3],["inflammation","염증","in- 안 + flamm 불꽃 + -ation 과정",38,"Inflammation causes swelling and redness.","염증은 붓기와 붉어짐을 일으킨다.",3],["tumor","종양","tum/o 부음 + -or 것 (결합형 onc/o)",39,"The tumor was small.","종양은 작았다.",3],["benign","양성의","ben/i 좋은 + -ign 나는",39,"The tumor was benign.","그 종양은 양성이었다.",3],["malignant","악성의","mal- 나쁜 + -ignant 나는",39,"A malignant tumor can spread.","악성 종양은 퍼질 수 있다.",3],["cancer","암","cancer 게 (결합형 carcin/o)",39,"Early cancer can often be cured.","초기 암은 흔히 완치될 수 있다.",3],["carcinoma","암종","carcin/o 암 + -oma 종양",39,"Most skin cancers are a carcinoma.","대부분의 피부암은 암종이다.",3],["sarcoma","육종","sarc/o 살 + -oma 종양",39,"A sarcoma can grow in bone.","육종은 뼈에 생길 수 있다.",3],["lymphoma","림프종","lymph/o 림프 + -oma 종양",39,"Lymphoma can cause swollen lymph nodes.","림프종은 림프절을 붓게 할 수 있다.",3],["metastasis","전이","meta- 너머 + -stasis 머무름",39,"Metastasis means the cancer has spread.","전이는 암이 퍼졌다는 뜻이다.",3],["carcinoma in situ","상피내암","carcinoma 암종 + in situ 제자리에",39,"Carcinoma in situ has not spread.","상피내암은 퍼지지 ","특발성의, 원인 모를","idi/o 자기만의 + -pathic 병의",41,"It is an idiopathic disease.","그것은 원인을 모르는 병이다.",4],["congenital","선천성의","con- 함께 + -genital 태어난",41,"She has a congenital hip problem.","그녀는 선천성 엉덩관절 문제가 있다.",4],["hereditary","유전성의","heredit 상속 + -ary ~의",41,"Hemophilia is a hereditary disease.","혈우병은 유전성 질환이다.",4],["iatrogenic","의인성의, 치료 때문에 생긴","iatr/o 치료 + -genic 생기게 하는",41,"The infection was iatrogenic.","그 감염은 치료 때문에 생겼다.",4],["nosocomial infection","병원감염","nosocomi/o 병원 + -al ~의 + infection 감염",41,"Hand washing prevents nosocomial infection.","손 씻기는 병원감염을 막는다.",4],["complication","합병증","com- 함께 + plic 접음 + -ation 과정",41,"Infection is a common complication.","감염은 흔한 합병증이다.",4],["remission","관해, 증상 완화","re- 뒤로 + miss 보냄 + -ion 것",41,"Her cancer is in remission.","그녀의 암은 관해 상태이다.",4],["relapse","재발","re- 다시 + lapse 미끄러짐",41,"A relapse can happen after treatment.","치료 후 재발이 생길 수 있다.",4],["recurrence","재발","re- 다시 + curr 달림 + -ence 것",41,"The doctor checks for recurrence every year.","의사는 해마다 재발 여부를 검사한다.",4],["exacerbation","악화","ex- 밖으로 + acerb 거친 + -ation 과정",41,"Cold air can cause an asthma exacerbation.","찬 공기는 천식 악화를 일으킬 수 있다.",4],["morbidity","이환, 질병률","morbid 병든 + -ity 상태",41,"Smoking raises morbidity.","흡연은 질병률을 높인다.",4],["mortality","사망, 사망률","mortal 죽는 + -ity 상태",41,"Infant mortality has fallen in Korea.","한국의 영아 사망률은 낮아졌다.",4],["incidence","발생률","in- 안 + cid 떨어짐 + -ence 것",41,"The incidence of flu is high in winter.","겨울에는 독감 발생률이 높다.",4],["prevalence","유병률","pre- 앞 + val 강함 + -ence 것",41,"The prevalence of diabetes is rising.","당뇨병 유병률이 높아지고 있다.",4],["epidemic","유행병","epi- 위 + -demic 사람들의",41,"There was a flu epidemic last year.","작년에 독감이 유행했다.",4],["pandemic","범유행, 세계적 대유행","pan- 전체 + -demic 사람들의",41,"The COVID-19 pandemic began in 2020.","코로나19 범유행은 2020년에 시작되었다.",4],["vital signs","활력징후","vital 생명의 + signs 징후",41,"The nurse checks vital signs every four hours.","간호사는 네 시간마다 활력징후를 잰다.",4],["body temperature","체온","body 몸 + temperature 온도",41,"Normal body temperature is about 36.5 degrees.","정상 체온은 약 36.5도이다.",4],["respiratory rate","호흡수","respiratory 호흡의 + rate 속도",41,"His respiratory rate is 20 per minute.","그의 호흡수는 1분에 20회이다.",4],["heart rate","심박수","heart 심장 + rate 속도",41,"Her heart rate is 80.","그녀의 심박수는 80이다.",4],["inspection","시진","in- 안 + spect 봄 + -ion 것",41,"Inspection means looking at the body.","시진은 몸을 눈으로 보는 것이다.",4],["palpation","촉진","palp 만짐 + -ation 과정",41,"Palpation of the belly showed pain.","배를 만져 보니 통증이 있었다.",4],["percussion","타진","per- 통과하여 + cuss 두드림 + -ion 것",41,"Percussion means tapping on the body.","타진은 몸을 두드려 보는 것이다.",4],["auscultation","청진","auscult 들음 + -ation 과정",41,"Auscultation is listening with a stethoscope.","청진은 청진기로 듣는 것이다.",4],["stethoscope","청진기","steth/o 가슴 + -scope 보는 기구",41,"The doctor put the stethoscope on my chest.","의사가 청진기를 내 가슴에 댔다.",4],["chief complaint","주호소, 주증상","chief 주된 + complaint 호소",41,"His chief complaint is chest pain.","그의 주호소는 가슴통증이다.",4],["present illness","현병력","present 현재의 + illness 병",41,"Write the present illness in the chart.","차트에 현병력을 쓰세요.",4],["past history","과거력","past 과거의 + history 병력",41,"His past history includes diabetes.","그의 과거력에는 당뇨병이 있다.",4],["family history","가족력","family 가족 + history 병력",41,"She has a family history of cancer.","그녀는 암 가족력이 있다.",4],["review of systems","계통문진","review 다시 봄 + of ~의 + systems 계통",41,"The review of systems found no other problems.","계통문진에서 다른 문제는 없었다.",4],["physical examination","신체검진","physical 신체의 + examination 검사",41,"The physical examination was normal.","신체검진은 정상이었다.",4],["specimen","검체","specimen 본보기",42,"Label the specimen with the patient's name.","검체에 환자 이름을 붙이세요.",4],["biopsy","생검, 조직검사","bi/o 생명 + -opsy 봄",42,"The biopsy showed no cancer.","조직검사에서 암은 보이지 않았다.",4],["blood test","혈액검사","blood 혈액 + test 검사",42,"You need a blood test today.","오늘 혈액검사를 하셔야 해요.",4],["complete blood count","일반혈액검사, 전체혈구계산","complete 완전한 + blood 혈액 + count 셈",42,"A complete blood count checks red and white cells.","일반혈액검 (function (root) {

      var day = s.days[d];
      if (d < today && !day.folded) { applyDay(s, d, day); day.folded = true; }
    });
    Object.keys(s.days).forEach(function (d) { if (diffDays(d, today) > 40) delete s.days[d]; });
  }

  function againList(s) {
    return Object.keys(s.words).filter(function (id) { return s.words[id].s === "l"; }).map(Number).sort(byNum);
  }
  function reviewList(s, today) {
    return Object.keys(s.words).filter(function (id) {
      var w = s.words[id]; return w.s === "r" && w.due && w.due <= today;

    } catch (e) { /* 소리를 낼 수 없는 환경 */ }

  /* ---------- 퀴즈 보기 만들기 ---------- */
  function tokens(m) {
    return m.replace(/\([^)]*\)/g, "").split(",").map(function (t) { return t.replace(/[~\s]/g, ""); }).filter(Boolean);
  }
  function overlaps(a, b) {
    var A = tokens(a), B = tokens(b);
    return A.some(function (x) {
      return B.some(function (y) {
        if (x === y) return true;
        if (x.length >= 2 && y.length >= 2) return x.indexOf(y) >= 0 || y.indexOf(x) >= 0 || x.slice(0, 2) === y.slice(0, 2);
        return false;
      });
    });
  }
  // 같은 분류에서 먼저, 모자라면 같은 단계, 그래도 모자라면 전체에서 고른다.
  function distractors(id) {
    var cat = W[id][3], lv = W[id][6], ko = W[id][1];
    function ok(j) { return j !== id && !overlaps(W[j][1], ko); }
    var pool = [], j;
    for (j = 0; j < W.length; j++) if (W[j][3] === cat && ok(j)) pool.push(j);
    if (pool.length < 3) { pool = []; for (j = 0; j < W.length; j++) if (W[j][6] === lv && ok(j)) pool.push(j); }
    if (pool.length < 3) { pool = []; for (j = 0; j < W.length; j++) if (ok(j)) pool.push(j); }
    shuffle(pool);
    var out = [];
    for (var k = 0; k < pool.length && out.length < 3; k++) {
      var c = pool[k];
      if (out.every(function (o) { return !overlaps(W[o][1], W[c][1]); })) out.push(c);
    }
    return out;
  }
  /* ---------- 카드로 본 단어 ---------- */
  // 카드(또는 저녁 체크 카드)에 한 번이라도 나온 단어. 퀴즈와 복습에는 이 단어만 나온다.
  // 이 기록이 생기기 전의 공부: 어제까지 배운 단어와 외운 단어는 본 것으로 친다.
  function seenCard(id) {
    if (S.seen && S.seen[id]) return true;
    var w = S.words[id];
    if (!w || w.s === "k") return false;
    if (w.s === "r" || w.s === "m") return true;
    return !!(w.in && w.in < today);
  }
  function markSeen(id) {
    if (!S.seen) S.seen = {};
    if (S.seen[id]) return;
    S.seen[id] = 1;
    writeAll();
  }
  // 퀴즈에 섞는 구성 요소 문제: 이미 카드로 배운 1단계 조각만 묻는다 (예: 배운 -itis → 염증).
  function partCands(ids) {
    var cand = [], used = {}, inSet = {};
    ids.forEach(function (id) { inSet[id] = 1; });
    ids.forEach(function (id) {
      breakdown(id).parts.forEach(function (p) {
        var pid = L1[p[0].toLowerCase()];
        if (pid === undefined || pid === id || used[pid] || inSet[pid] || !seenCard(pid)) return;
        used[pid] = 1;
        cand.push({ id: pid, from: id });
      });
    });
    return cand;
  }
  function partCap(n) { return Math.min(8, Math.ceil(n / 4)); }
  function partQuestions(ids, n) { return shuffle(partCands(shuffle(ids.slice()))).slice(0, n); }
  function quizCount(ids) { return ids.length + Math.min(partCands(ids).length, partCap(ids.length)); }
  // 구성 요소 문제에서 "~에 들어 있어요"에 쓸 단어 (1단계 조각이면 예시 단어)
  function fromWord(id) { var b = breakdown(id); return W[id][6] === 1 && b.result ? b.result[0] : W[id][0]; }
  function question(q) { return { id: q.id, from: q.from === undefined ? -1 : q.from, opts: shuffle([q.id].concat(distractors(q.id))) }; }
  function buildQuiz(ids, retryQs) {
    var qs;
    if (retryQs) qs = retryQs.map(question);
    else qs = ids.map(function (id) { return question({ id: id }); })
      .concat(partQuestions(ids, partCap(ids.length)).map(question));
    return { qs: shuffle(qs), i: 0, picked: -1, right: 0, wrong: [], wrongQs: [], done: false, retry: !!retryQs };
  }

      if (yRev) lines.push("<p>복습한 " + yRev + "개는 다음 복습 날이나 ‘완전히 외움’으로 넘어가요.</p>");
      var rows = its.map(function (x) {

        wordActs(it.id) + memoEditor(it.id),
      '<button class="btn no" data-act="mark" data-v="n">못 외웠다</button><button class="btn ok" data-act="mark" data-v="y">외웠다</button>', "two", "center");
  }

  /* ---------- 아는 단어 고르기 ---------- */
  function knownCandidates(limit) {
    var d = day(), out = [];
    d.newIds.forEach(function (id) { if (!d.checks[id]) out.push(id); });
    for (var L = S.level; L <= P.MAX_LEVEL && out.length < limit; L++) {
      for (var id = 0; id < W.length && out.length < limit; id++) {
        if (W[id][6] === L && !S.words[id] && out.indexOf(id) < 0) out.push(id);
      }
    }
    return out;
  }
  function knownHTML() {

    var tabs = '<div class="seg2"><button data-act="ktab" data-v="pick" aria-pressed="' + (k.tab === "pick") + '">고르기</button>' +
      '<button data-act="ktab" data-v="done" aria-pressed="' + (k.tab === "done") + '">뺀 단어 ' + knownIds.length + "</button></div>";
    if (k.tab === "done") {
      var rows = knownIds.map(function (id) {
        return '<div class="row"><div class="row-l"><span class="w" lang="en">' + esc(W[id][0]) + '</span><span class="m">' + esc(W[id][1]) + "</span></div>" +
          '<div class="tog"><button data-act="kundo" data-v="' + id + '">다시 배우기</button></div></div>';
      }).join("");
      return studyShell("아는 단어", "", null, tabs + (rows ? '<div class="rows">' + rows + "</div>" : '<p class="p">아직 뺀 단어가 없어요.</p>'), "", "", "");
    }
    var cands = knownCandidates(k.limit), d = day(), sel = Object.keys(k.sel).length, lastCat = -1, list = "";
    cands.forEach(function (id) {
      var w = W[id], on = !!k.sel[id];
      if (w[3] !== lastCat) { lastCat = w[3]; list += '<div class="kgroup">' + esc(CATS[w[3]]) + "</div>"; }
      list += '<button class="krow" data-act="ksel" data-v="' + id + '" aria-pressed="' + on + '"><span><span class="w" lang="en">' + esc(w[0]) + "</span>" +
        (d.newIds.indexOf(id) >= 0 ? '<span class="today">오늘</span>' : "") + '<span class="m">' + esc(w[1]) + '</span></span><span class="ck"></span></button>';
    });
    return studyShell("아는 단어", "", null,
      tabs + '<div class="rows">' + list + "</div>" + (cands.length >= k.limit ? '<button class="btn" data-act="kmore">30개 더 보기</button>' : ""),
      '<button class="btn primary" data-act="kapply"' + (sel ? "" : " disabled") + ">" + (sel ? sel + "개 빼기" : "아는 단어를 고르세요") + "</button>", "", "");
  }

  /* ---------- 공부하면서 난이도 조절 ---------- */
  // 최근 3일(새 단어를 5개 이상 체크한 날)의 '외웠다' 비율로 판단한다.
  function perfSignal() {
    if (S.adapt && S.adapt.snooze && S.adapt.snooze > today) return null;
    var out = [];
    Object.keys(S.days).sort().reverse().forEach(function (dk) {
      if (out.length >= 3) return;
      var dd = S.days[dk];
      if (!dd || !Array.isArray(dd.newIds)) return;
      var c = dd.newIds.filter(function (id) { return dd.checks && dd.checks[id]; });
      if (c.length >= 5) out.push(c.filter(function (id) { return dd.checks[id] === "y"; }).length / c.length);
    });
    if (out.length < 3) return null;
    if (out.every(function (r) { return r < 0.5; }) && S.settings.newPerDay > P.PER_DAY[0]) return "hard";
    return null;
  }
  function lowerPerDay() { return P.PER_DAY.filter(function (n) { return n < S.settings.newPerDay; }).pop(); }
  function adaptHTML() {
    var sig = perfSignal();
    if (sig === "hard") {
      var lower = lowerPerDay();
      var a = lower ? '<button class="btn" data-act="easier" data-v="perday">하루 ' + lower + "개로</button>" : "";
      return '<section class="card-s soft"><h2 class="card-h">조금 어려워 보여요</h2><p class="meta">3일 연속 새 단어를 절반도 못 외웠어요</p>' +
        '<div class="btn-row" style="grid-template-columns:1fr">' + a + "</div>" +
        '<button class="link" data-act="snooze">이대로 할게요</button></section>';
    }
    return "";
  }

/* ---- src/app/3-pages.js ---- */
  /* ---------- 기록 ---------- */
  function recordsHTML() {

  function ladderHTML() {
    var v = P.virtualToday(S, today), per = {};
    for (var l = 1; l <= P.MAX_LEVEL; l++) per[l] = { total: 0, done: 0, known: 0, learning: 0 };
    W.forEach(function (w, id) {
      var o = per[w[6]], st = v.words[id];
      o.total++;
      if (!st) return;
      if (st.s === "r" || st.s === "m") o.done++;
      else if (st.s === "k") o.known++;
      else if (st.s === "l") o.learning++;
    });
    var cur = P.frontier(S);
    function rung(l) {
      var o = per[l], pc = function (n) { return (n / o.total * 100).toFixed(1) + "%"; };
      return '<div class="rung' + (l === cur ? " now" : "") + '"><span class="nm"><b>' + l + "단계</b>" + LEVEL_NAMES[l] + "</span>" +
        '<div class="bar"><i class="ok" style="width:' + pc(o.done) + '"></i><i class="kn" style="width:' + pc(o.known) + '"></i><i class="soft" style="width:' + pc(o.learning) + '"></i></div>' +
        '<span class="ct">' + (o.done + o.known) + " / " + o.total + "</span></div>";
    }
    return '<section class="card-s"><div class="ladder">' + [7, 6, 5, 4, 3, 2, 1].map(rung).join("") + "</div>" +
      '<div class="legend"><span><i style="background:var(--ok)"></i>외움</span><span><i style="background:var(--faint)"></i>원래 알던 단어</span><span><i style="background:var(--accent-soft)"></i>외우는 중</span></div>' +
      "</section>";
  }
